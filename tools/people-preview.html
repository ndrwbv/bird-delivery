<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Люди — превью генератора</title>
  <style>
    body { margin: 0; background: #1d2238; color: #fff3d6; font: 13px/1.4 system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 14px; }
    header b { margin-right: 8px; }
    button { background: #2a3766; color: #fff3d6; border: 2px solid #33210c; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
    button.on { background: #ff6900; }
    #view { display: block; width: 100%; height: 520px; image-rendering: pixelated; background: #9fc3e0; }
    #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; padding: 14px; }
    .c { text-align: center; }
    .c img { width: 96px; height: 96px; border-radius: 10px; border: 3px solid #ff6900; image-rendering: pixelated; }
    .c b { display: block; font-weight: 600; }
    .c span { display: block; opacity: 0.7; font-size: 11px; }
  </style>
</head>
<body>
  <header><b>люди</b><span id="langs"></span><button id="reseed">новые зёрна</button></header>
  <canvas id="view"></canvas>
  <div id="cards"></div>
  <script type="module" src="./people-preview.js"></script>
</body>
</html>
