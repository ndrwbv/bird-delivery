<!DOCTYPE html>
<html lang="ru">
<head>

  <style>

    .on { color: #ffd34d; }
    table { border-collapse: collapse; margin: 6px 0 12px; }
    td { padding: 2px 12px 2px 0; vertical-align: top; }

  <div id="nav">
